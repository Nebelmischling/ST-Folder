<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <link rel="icon" href="/favicon.ico">
    <title>Character Folders — verification harness</title>
    <link rel="stylesheet" href="/css/jquery-ui.min.css">
    <link rel="stylesheet" href="/css/fontawesome.min.css">
    <link rel="stylesheet" href="/css/solid.min.css">
    <link rel="stylesheet" href="/css/brands.min.css">
    <link rel="stylesheet" href="/css/toggle-dependent.css">
    <link rel="stylesheet" href="/scripts/extensions/third-party/character-folders/style.css">
    <script src="/lib/jquery-3.5.1.min.js"></script>
    <script src="/lib/jquery-ui.min.js"></script>
    <script src="/lib/jquery.ui.touch-punch.min.js"></script>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background: #1b1b1f;
            color: #e8e8e8;
            font-family: sans-serif;
        }

        #shell {
            display: flex;
            justify-content: flex-end;
            height: 100vh;
        }

        #rm_characters_block {
            display: flex;
            flex-direction: column;
            width: 340px;
            padding: 8px;
            background: #26262c;
            overflow-y: auto;
        }

        #rm_print_characters_block {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .character_select {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px;
            border: 1px solid #444;
            border-radius: 4px;
            background: #303038;
        }

        .character_select .avatar img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
        }

        #cf_popup_host {
            position: fixed;
            top: 8px;
            left: 8px;
            width: 320px;
            padding: 8px;
            border: 1px solid #555;
            background: #2a2a30;
        }

        /* Fallback so icon-only buttons keep a hitbox even if the webfont is missing. */
        i[class*="fa-"] {
            display: inline-block;
            min-width: 1em;
            min-height: 1em;
        }
    </style>
</head>

<body class="charListGrid">
    <div id="shell">
        <div name="Character List Panel" id="rm_characters_block" class="right_menu">
            <div id="charListFixedTop">
                <div id="rm_button_bar">
                    <div id="rm_button_create" class="menu_button">+</div>
                </div>
                <div id="form_character_search_form">
                    <button id="nemo-char-browse-btn" class="menu_button"><i class="fa-solid fa-folder-open"></i> Browse</button>
                    <input id="character_search_bar" type="search" placeholder="Search...">
                </div>
                <div class="rm_tag_controls">
                    <div class="tags rm_tag_filter"></div>
                    <div class="tags rm_tag_bogus_drilldown"></div>
                </div>
            </div>
            <div id="rm_print_characters_pagination"></div>
            <div id="rm_print_characters_block" class="flexFlowColumn"></div>
        </div>
    </div>
    <div id="cf_popup_host"></div>

    <script type="module">
        import * as st from '/script.js';
        import { init } from '/scripts/extensions/third-party/character-folders/index.js';

        const state = {
            ready: false,
            popupCalls: [],
            toasts: [],
            saveCount: 0,
            nextInput: null,
            nextConfirm: false,
            nextPopupResult: null,
        };
        window.__cf = state;

        window.toastr = {
            success: message => state.toasts.push(['success', message]),
            info: message => state.toasts.push(['info', message]),
            warning: message => state.toasts.push(['warning', message]),
            error: message => state.toasts.push(['error', message]),
        };

        const POPUP_TYPE = { TEXT: 1, CONFIRM: 2, INPUT: 3, DISPLAY: 4 };
        const POPUP_RESULT = { AFFIRMATIVE: 1, NEGATIVE: 0, CANCELLED: null, CUSTOM1: 1001 };

        /**
         * Minimal Popup stand-in: records the call, mounts the content into a host
         * element so its controls are clickable, and returns a scripted result.
         */
        class Popup {
            constructor(content, type, value, options = {}) {
                this.content = content;
                this.type = type;
                this.value = value;
                this.options = options;
            }

            async show() {
                state.popupCalls.push({
                    type: this.type,
                    buttons: (this.options.customButtons ?? []).map(button => (typeof button === 'string' ? button : button.text)),
                    options: this.options,
                });
                if (this.content && typeof this.content.html === 'function') {
                    window.jQuery('#cf_popup_host').empty().append(this.content);
                }
                // When a test wants to interact with the popup first, it sets
                // deferPopups and resolves later via __cf.resolvePopup(result).
                let result = state.nextPopupResult;
                if (state.deferPopups) {
                    state.deferred = true;
                    result = await new Promise(resolve => {
                        state.resolvePopup = resolve;
                    });
                    state.deferred = false;
                }
                const closing = this.options.onClosing ? this.options.onClosing(this) : undefined;
                if (closing === false) {
                    return POPUP_RESULT.CANCELLED;
                }
                return result;
            }
        }

        Popup.show = {
            input: async () => state.nextInput,
            confirm: async () => state.nextConfirm,
        };

        const extensionSettings = {};
        const context = {
            characters: st.characters,
            extensionSettings,
            eventSource: st.eventSource,
            eventTypes: st.event_types,
            saveSettingsDebounced: () => {
                state.saveCount++;
            },
            isMobile: () => false,
            tags: [],
            tagMap: {},
            Popup,
            POPUP_TYPE,
            POPUP_RESULT,
            t: value => value,
        };

        window.SillyTavern = { getContext: () => context };
        state.filterFunctions = st.entitiesFilter.filterFunctions;
        state.printCount = () => st.__printCount();
        state.resolvePopup = null;

        // Mirrors the real SillyTavern lifecycle: with ?state=preset the extension is
        // initialised *before* the character list exists (script.js:747 runs
        // initExtensions() before getCharacters() at script.js:759). That is the
        // situation in which assignments must survive.
        const presetMode = new URLSearchParams(window.location.search).get('state') === 'preset';
        if (presetMode) {
            extensionSettings['character-folders'] = {
                version: 1,
                folders: [{ id: 'f_preset', name: 'Preset', parentId: null, order: 0, color: '', collapsed: false }],
                assignments: { 'Aria.png': 'f_preset', 'Borin.png': 'f_preset' },
                ui: {},
            };
        } else {
            st.__seedCharacters([
                { name: 'Aria', avatar: 'Aria.png' },
                { name: 'Borin', avatar: 'Borin.png' },
                { name: 'Cleo', avatar: 'Cleo.png' },
                { name: 'Dorn', avatar: 'Dorn.png' },
                { name: 'Echo', avatar: 'Echo.png' },
            ]);
            st.printCharacters();
        }

        await init();
        state.seedCharacters = st.__seedCharacters;
        state.ready = true;    </script>
</body>

</html>
